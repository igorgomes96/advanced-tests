version: '3.8'

services:
  quotation:
    container_name: ordersdb
    hostname: ordersdb
    image: mysql
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root

networks:
  default:
    name: ecommerce
    external: true